<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รัน AI ตัวไหนไหว</title>
  <meta name="description" content="สแกนสเปกเครื่องในบราวเซอร์ แล้วแนะนำโมเดล Local AI ที่รันได้สบายโดยไม่ทำเครื่องหน่วง พร้อมคำสั่งติดตั้ง">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
</head>
<body>
  <div class="toggles">
    <button id="langBtn" class="chip-toggle" type="button" aria-label="Switch language">TH</button>
    <button id="themeBtn" class="chip-toggle" type="button" aria-label="สลับธีม"></button>
  </div>

  <div class="wrap">
    <header>
      <div class="eyebrow"><span class="dot"></span> <span data-i18n="eyebrow"></span></div>
      <h1 data-i18n-html="h1_html"></h1>
      <p class="lede" data-i18n-html="lede_html"></p>
    </header>

    <section>
      <div class="scanrow">
        <button class="btn btn-primary" id="scanBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l2 5 4-13 2 8h6"/></svg>
          <span data-i18n="scan"></span>
        </button>
        <span class="privacy">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span data-i18n="privacy"></span>
        </span>
      </div>
    </section>

    <section>
      <div class="sec-head"><span class="sec-num">01</span><h2 data-i18n="sec_specs"></h2></div>
      <div class="panel pad">
        <div class="readout-top">
          <span class="machine" id="osLine">— · —</span>
          <span class="badge-ex" id="stateBadge"></span>
        </div>
        <div class="fields">
          <div class="field">
            <label><span data-i18n="lbl_ram"></span> <span class="det" id="ramDet"></span></label>
            <input type="number" id="ram" min="1" max="512" step="1">
          </div>
          <div class="field">
            <label><span data-i18n="lbl_gpu"></span></label>
            <select id="gpuClass">
              <option value="discrete" data-i18n="gpu_discrete"></option>
              <option value="apple" data-i18n="gpu_apple"></option>
              <option value="integrated" data-i18n="gpu_integrated"></option>
            </select>
          </div>
          <div class="field" id="vramField">
            <label><span data-i18n="lbl_vram"></span> <span class="det" id="vramDet"></span></label>
            <input type="number" id="vram" min="0" max="192" step="1">
          </div>
          <div class="field">
            <label><span data-i18n="lbl_os"></span></label>
            <select id="os">
              <option value="win">Windows</option>
              <option value="mac">macOS</option>
              <option value="linux">Linux</option>
            </select>
          </div>
        </div>
        <div class="hint">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span data-i18n-html="hint_specs_html"></span>
        </div>
        <details class="precise">
          <summary data-i18n="precise_summary"></summary>
          <div class="precise-body">
            <p data-i18n-html="precise_intro_html"></p>
            <div class="cmd"><code id="cmdPrecise"></code><button class="copy" data-target="cmdPrecise" data-i18n="copy"></button></div>
            <p class="precise-note" data-i18n="precise_note"></p>
          </div>
        </details>
      </div>
    </section>

    <section>
      <div class="sec-head"><span class="sec-num">02</span><h2 data-i18n="sec_reco"></h2></div>
      <div style="margin-bottom:14px">
        <div class="segmented" id="taskTabs" role="tablist">
          <button class="tab" role="tab" data-task="general" aria-selected="true" data-i18n="task_general"></button>
          <button class="tab" role="tab" data-task="coding" aria-selected="false" data-i18n="task_coding"></button>
          <button class="tab" role="tab" data-task="reasoning" aria-selected="false" data-i18n="task_reasoning"></button>
        </div>
      </div>
      <div class="panel pad reco selectable" id="recoCard">
        <div class="verdict" id="verdict"><span class="lamp lamp-good"></span><span id="verdictText"></span><span class="pick-tag" id="mActive" data-i18n="pick_this"></span></div>
        <div class="model-name" id="mName">—</div>
        <p class="model-sub" id="mDesc">—</p>
        <div class="reqs" id="reqs"></div>
        <div class="chips" id="mChips"></div>

        <div class="gauge-wrap">
          <div class="gauge-head"><span id="gaugePool"></span><span id="gaugeNums"></span></div>
          <div class="gauge">
            <div class="seg seg-model" id="segModel" style="width:0%"></div>
          </div>
          <div class="gauge-legend">
            <span><span class="sw" style="background:var(--accent)"></span> <span data-i18n="legend_use"></span></span>
            <span><span class="sw" style="background:var(--surface-2);border:1px solid var(--line-strong)"></span> <span data-i18n="legend_free"></span></span>
          </div>
        </div>

        <div class="pick-hint" data-i18n="pick_hint"></div>
        <div class="alts">
          <div class="alt selectable" id="altLight"></div>
          <div class="alt selectable" id="altHeavy"></div>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head"><span class="sec-num">03</span><h2 data-i18n="sec_install"></h2>
        <button class="btn-copyall" id="copyAll" type="button" data-i18n="copyall"></button>
      </div>
      <div class="panel pad">
        <div class="steps">
          <div class="step">
            <div class="step-n">1</div>
            <div class="step-body">
              <div class="st" data-i18n="step1_t"></div>
              <div class="cmd"><code id="cmdInstall"></code><button class="copy" data-target="cmdInstall" data-i18n="copy"></button></div>
              <div class="altcmd" id="installAlt"></div>
            </div>
          </div>
          <div class="step">
            <div class="step-n">2</div>
            <div class="step-body">
              <div class="st" id="step2Title"></div>
              <div class="cmd"><code id="cmdRun"></code><button class="copy" data-target="cmdRun" data-i18n="copy"></button></div>
              <div class="altcmd" data-i18n="step2_hint"></div>
            </div>
          </div>
          <div class="step">
            <div class="step-n">3</div>
            <div class="step-body">
              <div class="st" data-i18n="step3_t"></div>
              <div class="altcmd" style="font-size:.88rem;color:var(--ink-soft)" data-i18n-html="step3_b_html"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head"><span class="sec-num">04</span><h2 data-i18n="sec_howto"></h2></div>
      <p class="howto-intro" data-i18n="howto_intro"></p>
      <div class="panel pad"><div class="howto" id="howtoList"></div></div>
    </section>

    <section>
      <div class="sec-head"><span class="sec-num">05</span><h2 data-i18n="sec_catalog"></h2></div>
      <div class="tablewrap">
        <table id="catalog">
          <thead><tr><th data-i18n="th_model"></th><th data-i18n="th_size"></th><th data-i18n="th_mem"></th><th data-i18n="th_skill"></th></tr></thead>
          <tbody id="catBody"></tbody>
        </table>
      </div>
      <div class="note"><span data-i18n-html="note_html"></span><span id="genAt"></span></div>
    </section>

    <footer>
      <span data-i18n="footer_a"></span>
      <span data-i18n="footer_b"></span>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
