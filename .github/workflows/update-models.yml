name: อัปเดตรายชื่อโมเดล (Ollama)

# รันทุกวันจันทร์ 07:00 (เวลาไทย = 00:00 UTC) และกดรันเองได้จากแท็บ Actions
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ดึงขนาดโมเดลจาก Ollama registry
        run: node scripts/fetch-models.mjs

      - name: commit ถ้ามีการเปลี่ยนแปลง
        run: |
          if git diff --quiet -- public/models.json; then
            echo "ไม่มีการเปลี่ยนแปลง"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/models.json
            git commit -m "chore: อัปเดต models.json จาก Ollama registry"
            git push
          fi
